<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRODESAL Peumo 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--b1:#1a3f6f;--b2:#2563eb;--g:#059669;--o:#d97706;--p:#7c3aed;--r:#dc2626;--bg:#f1f5f9;--w:#fff;--br:#e2e8f0;--tx:#1e293b;--mu:#64748b}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.hd{background:linear-gradient(135deg,#ffffff 0%,#e8f5e9 40%,#4caf50 100%);color:#1b5e20;padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.hd h1{font-size:16px;color:#1b5e20}.hd small{opacity:.8;font-size:11px;display:block;margin-top:1px;color:#2e7d32}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--br);position:sticky;top:52px;z-index:40}
.tb{flex:1;padding:8px 2px 6px;border:none;background:none;font-size:10px;color:var(--mu);cursor:pointer;text-align:center;border-bottom:3px solid transparent}
.tb.on{color:var(--b2);border-bottom-color:var(--b2);font-weight:700;background:#eff6ff}
.tb i{display:block;font-size:18px;font-style:normal;margin-bottom:1px}
.ct{max-width:800px;margin:0 auto;padding:10px 10px 100px}
.cd{background:var(--w);border-radius:12px;border:1px solid var(--br);padding:12px;margin-bottom:8px}
.tg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.tg-g{background:#dcfce7;color:#166534}.tg-o{background:#fef3c7;color:#854d0e}.tg-b{background:#dbeafe;color:#1d4ed8}.tg-p{background:#ede9fe;color:#6d28d9}.tg-y{background:#f1f5f9;color:#475569}
.sb{position:relative;margin-bottom:10px}
.sb input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--br);border-radius:12px;font-size:14px;background:#fff}
.sb::before{content:'🔍';position:absolute;left:10px;top:9px;font-size:13px}
.bt{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.bt:active{transform:scale(.97)}
.bt-b{background:var(--b2);color:#fff}.bt-g{background:var(--g);color:#fff}.bt-o{background:var(--o);color:#fff}.bt-p{background:var(--p);color:#fff}
.bt-s{padding:6px 12px;font-size:12px}.bt-x{background:none;border:1px solid var(--br);color:var(--tx)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:2px}
.ip{display:block;width:100%;padding:9px 10px;border:1px solid var(--br);border-radius:8px;font-size:14px;background:#fff;font-family:inherit;-webkit-appearance:none}
select.ip{-webkit-appearance:menulist;background:#fff}
textarea.ip{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{margin-top:10px}.mb{margin-bottom:10px}.mu{color:var(--mu);font-size:12px}
.empty{text-align:center;padding:30px;color:var(--mu)}.empty i{font-size:40px;font-style:normal;display:block;margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ch{padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid var(--br);background:#fff;cursor:pointer}
.ch.on{background:var(--b2);color:#fff;border-color:var(--b2)}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px}
.ok-box{background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px}
.ok-box b{color:#166534;font-size:15px}
.ok-box p{color:var(--mu);font-size:12px;margin-top:4px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px}
.st{text-align:center;padding:10px;background:#f8fafc;border-radius:10px}
.st .n{font-size:24px;font-weight:800}.st .l{font-size:9px;color:var(--mu)}
.fs{margin-top:12px;padding-top:10px;border-top:1px solid var(--br)}
.fs h4{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.ifp{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f8fafc;font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:8px 20px;border-radius:10px;font-size:13px;z-index:100;animation:su .25s}
@keyframes su{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
/* Autocomplete */
.acw{position:relative}
.acl{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--br);border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
.acl.show{display:block}
.aci{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f8fafc}
.aci:active{background:#eff6ff}
.aci small{color:var(--mu);font-size:11px;display:block}
/* Photo buttons */
.foto-btns{display:flex;gap:8px;margin:8px 0}
.foto-btn{flex:1;padding:12px;border:2px dashed var(--br);border-radius:10px;background:#fafafa;text-align:center;cursor:pointer;font-size:12px;color:var(--mu)}
.foto-btn:active{background:#eff6ff;border-color:var(--b2)}
.foto-btn i{font-size:24px;font-style:normal;display:block;margin-bottom:4px}
.cam-p{width:100%;max-height:250px;object-fit:contain;border-radius:8px;border:1px solid var(--br);margin-top:8px}
@media(max-width:500px){.g2{grid-template-columns:1fr}}
</style>
</head>

let nominaLoaded=false;
async function cargarNomina(){
  // 1. Intentar cargar caché localStorage
  try{
    const cached=localStorage.getItem('prodesal_nomina');
    if(cached){
      const data=JSON.parse(cached);
      if(data.agricultores && data.agricultores.length>0){
        U=data.agricultores;
        nominaLoaded=true;
        console.log('Nómina cargada desde caché:',U.length,'agricultores');
        R(); // Re-render
      }
    }
  }catch(e){console.warn('Error leyendo caché nómina:',e)}

  // 2. Fetch desde Google Sheets (en segundo plano)
  try{
    const nBtn=document.getElementById('nominaStatus');
    if(nBtn)nBtn.innerHTML='🔄 Actualizando nómina...';
    const resp=await fetch(SYNC_URL+'?action=nomina');
    const data=await resp.json();
    if(data.agricultores && data.agricultores.length>0){
      U=data.agricultores;
      nominaLoaded=true;
      // Guardar en caché
      try{localStorage.setItem('prodesal_nomina',JSON.stringify(data))}catch(e){}
      console.log('Nómina actualizada desde Sheet:',U.length,'agricultores al',data.updated);
      R(); // Re-render con datos frescos
      if(nBtn)nBtn.innerHTML='✅ Nómina sincronizada ('+U.length+' agricultores)';
      setTimeout(()=>{if(nBtn)nBtn.innerHTML=''},3000);
    }else{
      if(nBtn)nBtn.innerHTML='⚠️ Sin datos en Sheet (usando caché)';
      setTimeout(()=>{if(nBtn)nBtn.innerHTML=''},3000);
    }
  }catch(e){
    console.warn('Error cargando nómina desde Sheet:',e);
    const nBtn=document.getElementById('nominaStatus');
    if(nBtn){
      nBtn.innerHTML='📴 Sin conexión (usando '+(nominaLoaded?'caché':'datos locales')+')';
      setTimeout(()=>{if(nBtn)nBtn.innerHTML=''},4000);
    }
  }
}

const uid=()=>'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function getActList(key,seccion){
  const d=actData[key]||{};let v=d[seccion];let dirty=false;
  if(typeof v==='string'){v=v.trim()?[{fecha:'',lugar:'',texto:v}]:[];dirty=true}

  v.forEach(a=>{if(!a.id){a.id=uid();dirty=true}if(a.titulo==null){a.titulo='';dirty=true}});
  if(dirty){if(!actData[key])actData[key]={};actData[key][seccion]=v;saveActs()}

}

// Fotos por actividad (actFotos[idActividad] = [{name,data,w,h}]) — máximo 4; el informe usa 2 o 4
function addFoto(actId,file){
  if(!actFotos[actId])actFotos[actId]=[];
  if(actFotos[actId].length>=MAX_FOTOS){nf('⚠️ Máximo '+MAX_FOTOS+' fotos por actividad');return}
  const reader=new FileReader();
  reader.onload=e=>{
    const lista=actFotos[actId];if(lista.length>=MAX_FOTOS)return;
    const foto={name:file.name,data:e.target.result,w:4,h:3};
    const im=new Image();im.onload=()=>{foto.w=im.naturalWidth||4;foto.h=im.naturalHeight||3};im.src=foto.data;
    lista.push(foto);
    renderFotoPreview(actId);
    if(lista.length%2) nf('📷 '+lista.length+' foto(s). El informe usa 2 o 4 por actividad: agrega una más');
    else nf('📷 '+lista.length+' fotos listas');
  };
  reader.readAsDataURL(file);
}
function fotosPares(actId){const f=actFotos[actId]||[];return f.slice(0,f.length>=4?4:f.length>=2?2:0)}

    +(fotos.length>=MAX_FOTOS?'<span style="font-size:10px;color:#6b7280;margin-left:6px">Máximo alcanzado</span>':'');
}

function secuenciaASemana(seq,semanaDetectada){
  let semana=semanaDetectada;
  if(!semana){for(const e of seq){if(e.t!=='txt')continue;const m=e.s.match(/semana\s+(\d{1,2})\b/i);if(m){semana=+m[1];break}}}

  const nueva=(o={})=>{actual={id:uid(),titulo:'',fecha:'',lugar:'',texto:'',...o};(acts[cur]=acts[cur]||[]).push(actual);return actual};
  const esMayus=t=>t.length<=120&&t===t.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(t);
  const limpiaLugar=t=>t.replace(/^[\s,·•\-–—]+|[\s,·•\-–—]+$/g,'').replace(/^(lugar|sector)\s*:\s*/i,'').replace(/\s*,\s*(?:(?:'+DIAS_RX+')(?:\s+y\s+\w+)?)\s*$/i,'').trim();
  for(const e of seq){
    if(e.t==='img'){if(cur){if(!actual)nueva();(fotos[actual.id]=fotos[actual.id]||[]);if(fotos[actual.id].length<MAX_FOTOS)fotos[actual.id].push({name:'importada',data:e.data,w:e.w,h:e.h})}continue}
    const s=e.s.replace(/\s+/g,' ').trim();if(!s)continue;

async function seqDesdeDocx(file,soloCuerpo){

    if(m&&m[1].includes('prodesal_semana')){const txt=m[1].replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      try{const d=JSON.parse(txt);return {embebido:d}}catch(e){}}}
  const doc=await zip.file('word/document.xml').async('string');
  const relsX=await (zip.file('word/_rels/document.xml.rels')?.async('string')||'');
  const rels={};relsX.replace(/<Relationship\b[^>]*>/g,t=>{const id=t.match(/Id="([^"]+)"/),tg=t.match(/Target="([^"]+)"/);if(id&&tg)rels[id[1]]=tg[1];return ''});
  const seq=[];const paras=doc.match(/<w:p\b[\s\S]*?<\/w:p>/g)||[];
  for(const p of paras){
    const txt=(p.match(/<w:t\b[^>]*>[\s\S]*?<\/w:t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'')).join('').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    if(txt.trim())seq.push({t:'txt',s:txt});
    for(const b of (p.match(/r:embed="([^"]+)"/g)||[])){const rid=b.match(/"([^"]+)"/)[1];let tg=rels[rid];if(!tg)continue;tg=tg.replace(/^\//,'');const f=zip.file('word/'+tg)||zip.file(tg);if(!f)continue;
      const ext=(tg.split('.').pop()||'jpg').toLowerCase();const mime=ext==='png'?'image/png':ext==='gif'?'image/gif':'image/jpeg';
      const data=await comprimirDataURL(await blobToDataURL(new Blob([await f.async('uint8array')],{type:mime})));const d=await dimsDeDataURL(data);
      if(d.w<120||d.h<120)continue;seq.push({t:'img',data,w:d.w,h:d.h})}

}
// --- .doc antiguo (HTML con imágenes incrustadas) ---
async function seqDesdeDocHtml(file){
  const html=await file.text();if(!/<html|<table|<body/i.test(html))throw new Error('el .doc no es del formato HTML generado por la app');
  const dom=new DOMParser().parseFromString(html,'text/html');const seq=[];
  const walk=async n=>{for(const c of Array.from(n.childNodes)){
    if(c.nodeType===3){const s=c.textContent;if(s.trim())seq.push({t:'txt',s})}
    else if(c.nodeType===1){if(c.tagName==='IMG'){const src=c.getAttribute('src')||'';if(src.startsWith('data:image')&&src!==LOGO_INDAP&&src!==LOGO_PEUMO&&src!==LOGO_PRODESAL){const d=await dimsDeDataURL(src);if(d.w>=120&&d.h>=120)seq.push({t:'img',data:await comprimirDataURL(src),w:d.w,h:d.h})}}
      else if(!/^(SCRIPT|STYLE|XML)$/.test(c.tagName)){const block=/^(P|TR|TD|DIV|LI|H\d|TABLE|BR)$/.test(c.tagName);if(block)seq.push({t:'txt',s:'\n'});await walk(c);if(block)seq.push({t:'txt',s:'\n'})}}}};
  await walk(dom.body);
  // unir textos contiguos en líneas
  const out=[];let buf='';for(const e of seq){if(e.t==='txt'){if(e.s==='\n'){if(buf.trim())out.push({t:'txt',s:buf});buf=''}else buf+=e.s}else{if(buf.trim())out.push({t:'txt',s:buf});buf='';out.push(e)}}if(buf.trim())out.push({t:'txt',s:buf});
  return {seq:out};
}

async function seqDesdePdf(file){
  await cargarPdfjs();const pdfjs=window.pdfjsLib;
  const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
  const seq=[];const vistos={};const candidatos=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const page=await pdf.getPage(pn);const items=[];
    const tc=await page.getTextContent();
    // agrupar en líneas por coordenada y
    const lineas={};tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]);const k=Object.keys(lineas).find(yy=>Math.abs(yy-y)<=3);const kk=k!=null?k:y;(lineas[kk]=lineas[kk]||[]).push({x:it.transform[4],w:it.width||0,s:it.str})});
    Object.keys(lineas).forEach(y=>{const arr=lineas[y].sort((a,b)=>a.x-b.x);let s='';let fin=null;arr.forEach(o=>{if(fin!=null&&o.x-fin>1.2&&!s.endsWith(' '))s+=' ';s+=o.s;fin=o.x+o.w});s=s.replace(/\s+/g,' ');items.push({y:+y,t:'txt',s})});
    // imágenes con seguimiento de la matriz de transformación
    const ops=await page.getOperatorList();let ctm=[1,0,0,1,0,0];const stack=[];
    const mul=(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]];
    for(let i=0;i<ops.fnArray.length;i++){const fn=ops.fnArray[i],a=ops.argsArray[i];
      if(fn===pdfjs.OPS.save)stack.push(ctm.slice());else if(fn===pdfjs.OPS.restore)ctm=stack.pop()||[1,0,0,1,0,0];
      else if(fn===pdfjs.OPS.transform)ctm=mul(ctm,a);
      else if(fn===pdfjs.OPS.paintImageXObject||fn===pdfjs.OPS.paintJpegXObject){const name=a[0];let im=null;try{if(page.objs.has(name))im=page.objs.get(name)}catch(e){}if(!im){try{if(page.commonObjs.has(name))im=page.commonObjs.get(name)}catch(e){}}
        if(!im)continue;const hPt=Math.abs(ctm[3])||Math.abs(ctm[1]),y=ctm[5]+Math.max(0,ctm[3]);

  const huella=im=>{const d=im.data||new Uint8Array(0);let h=0;const step=Math.max(1,Math.floor(d.length/256));for(let i=0;i<d.length;i+=step)h=(h*31+d[i])>>>0;return (im.width||0)+'x'+(im.height||0)+'_'+h};
  const firmas={};candidatos.forEach(c=>{c.k=huella(c.im);firmas[c.k]=(firmas[c.k]||new Set());firmas[c.k].add(c.pn)});
  for(const c of candidatos){if(firmas[c.k].size>1&&pdf.numPages>1&&c.hPt<110)continue;if(c.hPt<45||(c.im.width||0)<120||(c.im.height||0)<120)continue;

// Une líneas que el PDF cortó al final del renglón (p. ej. "…comuna de Peumo, 3 DE" + "SEPTIEMBRE DE 2026.")
function fusionarLineasPdf(items){
  const out=[];const mesRx=new RegExp('^(?:'+MESES_RX+'|de\\s+\\d{4})','i');
  for(const it of items){
    const prev=out[out.length-1];
    if(it.t==='txt'&&prev&&prev.t==='txt'){
      const a=prev.s.trim(),b=it.s.trim();
      const aUp=a===a.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(a),bUp=b===b.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(b);
      const cortada=!/[.:;!?]$/.test(a)&&(/\b(DE|DEL|Y|LA|EL|EN|LOS|LAS|AL|CON|POR|PARA|\d{1,2})$/i.test(a)||mesRx.test(b)||/^[a-záéíóúñ]/.test(b)||(aUp&&bUp&&a.length>55));
      const esTituloSec=SEC_RX.some(x=>x.rx.test(b)||x.rxs.test(b.replace(/\s+/g,'')))||FIN_RX.test(b)||RUIDO_RX.test(b)||/^semana\s+\d+/i.test(b);
      if(cortada&&!esTituloSec&&a.length+b.length<600){prev.s=a+' '+b;continue}
    }
    out.push(it);
  }
  return out;
}
async function imagenPdfADataURL(im){
  try{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const ctx=c.getContext('2d');
    if(im.bitmap){ctx.drawImage(im.bitmap,0,0);return c.toDataURL('image/jpeg',0.85)}
    const d=im.data;if(!d)return null;const out=ctx.createImageData(im.width,im.height);const n=im.width*im.height;

    else if(im.kind===1){const rowBytes=Math.ceil(im.width/8);for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){const bit=(d[y*rowBytes+(x>>3)]>>(7-(x&7)))&1;const i=(y*im.width+x)*4;out.data[i]=out.data[i+1]=out.data[i+2]=bit?255:0;out.data[i+3]=255}}
    else return null;
    ctx.putImageData(out,0,0);return c.toDataURL('image/jpeg',0.85)}catch(e){return null}
}

function filterNom(){
  const cards=document.querySelectorAll('.ucard');

  const q=nq(sq).trim();
  let shown=0;
  cards.forEach(c=>{
    const t=c.dataset.t||'';const f=c.dataset.f||'';const s=c.dataset.s||'';
    let show=true;
    if(q&&!q.split(/\s+/).every(w=>s.includes(w)))show=false;

function onCfgName(val){

function saveCfg(){
  const nom=document.getElementById('cNom')?.value;
  if(!nom){alert('Selecciona tu nombre');return}
  const eq=EQUIPO.find(e=>e.nombre===nom);
  cfg.nombre=nom;
  cfg.abr=eq?eq.abr:abv(nom);
  cfg.cargo=document.getElementById('cCargo')?.value||'Asesor Técnico';
  const full=(document.getElementById('cFull')?.value||'').trim();
  if(full){cfg.nombres=cfg.nombres||{};cfg.nombres[cfg.abr]=full}
  cfg.coord=document.getElementById('cK')?.value||cfg.coord;
  cfg.contra=document.getElementById('cP')?.value||cfg.contra;
  cfg.ejecutiva=document.getElementById('cE')?.value||cfg.ejecutiva||'Beatriz Baquedano';
  cfg.cEjecutiva=document.getElementById('cCE')?.value||cfg.cEjecutiva||'Ejecutiva INDAP';
  const rutV=(document.getElementById('cRut')?.value||'').trim();
  if(rutV){cfg.ruts=cfg.ruts||{};cfg.ruts[cfg.abr]=rutV;cfg.rut=rutV}
  cfg.depto=document.getElementById('cD')?.value||cfg.depto;
  cfg.unidad=document.getElementById('cU')?.value||cfg.unidad;
  const ak=document.getElementById('cApi')?.value?.trim();
  if(ak)cfg.apiKey=ak;
  SV('cfg',cfg);
  document.getElementById('hs').textContent=cfg.nombre+' — '+cfg.cargo;
  nf('✅ Configuración guardada');
  R();
}

async function testApi(){
  const ak=document.getElementById('cApi')?.value?.trim();
  const st=document.getElementById('apiSt');
  if(!ak||!ak.startsWith('sk-')){st.innerHTML='<span style="color:var(--r)">❌ Key inválida</span>';return}
  st.innerHTML='<span style="color:var(--o)">⏳ Probando...</span>';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:20,messages:[{role:'user',content:'Responde solo: OK'}]})
    });
    if(r.ok){
      cfg.apiKey=ak;SV('cfg',cfg);
      st.innerHTML='<span style="color:var(--g)">✅ Conexión exitosa</span>';
    }else{
      const e=await r.json();
      st.innerHTML='<span style="color:var(--r)">❌ '+(e.error?.message||'Error '+r.status)+'</span>';
    }
  }catch(e){
    st.innerHTML='<span style="color:var(--r)">❌ Sin conexión: '+h(e.message)+'</span>';
  }
}

function xprt(){
  const d=JSON.stringify({cfg,vis,reu,v:3,date:new Date().toISOString()},null,2);
  const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);

function impt(inp){
  if(!inp.files[0])return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.cfg){cfg=d.cfg;SV('cfg',cfg)}if(d.vis){vis=d.vis;SV('vis',vis)}if(d.reu){reu=d.reu;SV('reu',reu)}R();nf('📥 Importado OK')}catch{alert('Error en archivo')}};
  r.readAsText(inp.files[0])
}

// ========= ESTANDARIZAR ASESOR =========
function stdAsesor(val){
  if(!val)return cfg.abr||'';
  const n=(val||'').replace(/\.\s*/g,'.').toUpperCase().trim();
  const match=EQUIPO.find(e=>{
    const abr=e.abr.replace(/\.\s*/g,'.').toUpperCase().trim();
    const nom=e.nombre.toUpperCase().trim();
    return n===abr||n===nom||n.includes(abr)||abr.includes(n);
  });
  return match?match.abr:val;
}

// ========= FOTO + OCR CON CLAUDE VISION API =========
function onFoto(input){
  const p=document.getElementById('imgP');
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=1000;
      let w=img.width,ht=img.height;
      if(w>MAX||ht>MAX){const r=Math.min(MAX/w,MAX/ht);w*=r;ht*=r}
      canvas.width=w;canvas.height=ht;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,ht);
      ctx.drawImage(img,0,0,w,ht);
      const jpegB64=canvas.toDataURL('image/jpeg',0.5);
      p.innerHTML=`<img src="${jpegB64}" class="cam-p">`;
      p.dataset.src=jpegB64;
      ocrFolio(jpegB64);
    };
    img.onerror=()=>{
      p.innerHTML='';
      const st=document.getElementById('ocrStatus');
      st.innerHTML='<div class="cd" style="background:#fef3c7;border-color:#f59e0b;padding:12px"><b>\u26a0\ufe0f Formato no soportado</b><p class="mu mt">Tu navegador no soporta este formato. Usa la c\u00e1mara del navegador o convierte a JPG.</p></div>';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function ocrFolio(imgBase64){
  const st=document.getElementById('ocrStatus');
  
  if(!cfg.apiKey){
    st.innerHTML='<div class="cd" style="background:#fef3c7;border-color:#f59e0b;padding:12px"><b>\u26a0\ufe0f Sin API Key</b><p class="mu mt">Ve a \u2699\ufe0f Config y pega la API Key para habilitar la lectura autom\u00e1tica de folios.</p><button class="bt bt-b bt-s mt" onclick="go(\'cfg\')">Ir a Config</button></div>';
    return;
  }
  
  st.innerHTML='<div class="cd" style="background:#eff6ff;border-color:#93c5fd;padding:16px;text-align:center"><div style="font-size:28px;margin-bottom:8px">\ud83d\udd0d</div><b style="color:var(--b2)">Leyendo folio con IA...</b><p class="mu mt">Transcribiendo datos y mejorando redacci\u00f3n t\u00e9cnica</p></div>';
  
  try{
    const match=imgBase64.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
    if(!match)throw new Error('Formato de imagen no v\u00e1lido');
    const mediaType=match[1];
    const b64Data=match[2];
    
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':cfg.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1200,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:b64Data}},
            {type:'text',text:'Eres un asistente del programa PRODESAL Peumo (INDAP Chile). Analiza esta foto de un folio de visita t\u00e9cnica y extrae SOLO la observaci\u00f3n/recomendaci\u00f3n escrita.\n\nIMPORTANTE: Responde SOLO con un JSON v\u00e1lido, sin texto adicional ni backticks. El formato exacto es:\n{\"observacion_original\":\"lo que dice el folio tal cual, transcripci\u00f3n fiel de lo escrito\",\"observacion_mejorada\":\"reescribe la observaci\u00f3n con redacci\u00f3n t\u00e9cnica profesional para un informe INDAP, manteniendo el sentido pero mejorando gram\u00e1tica, vocabulario t\u00e9cnico agropecuario y estructura. Debe sonar profesional y claro para el informe.\"}\n\nSi no puedes leer la observaci\u00f3n, d\u00e9jala como cadena vac\u00eda \"\".\nLa observaci\u00f3n mejorada debe ser redactada en tercera persona, con lenguaje t\u00e9cnico agropecuario, lista para copiar al informe INDAP.\nNO extraigas fecha, nombre, RUT ni folio \u2014 solo la observaci\u00f3n.'}
          ]
        }]
      })
    });
    
    if(!response.ok){
      const errData=await response.json().catch(()=>({}));
      const msg=errData.error?.message||'Error '+response.status;
      if(response.status===401){
        st.innerHTML='<div class="cd" style="background:#fee2e2;border-color:#fca5a5;padding:12px"><b style="color:var(--r)">\u274c API Key inv\u00e1lida</b><p class="mu mt">Revisa la key en \u2699\ufe0f Config.</p></div>';
      }else if(response.status===429){
        st.innerHTML='<div class="cd" style="background:#fef3c7;border-color:#f59e0b;padding:12px"><b>\u26a0\ufe0f L\u00edmite alcanzado</b><p class="mu mt">Espera unos segundos e intenta de nuevo.</p></div>';
      }else{
        st.innerHTML='<div class="cd" style="background:#fee2e2;border-color:#fca5a5;padding:12px"><b style="color:var(--r)">\u274c '+h(msg)+'</b></div>';
      }
      return;
    }
    
    const data=await response.json();
    const text=data.content?.map(c=>c.text||'').join('')||'';
    
    let parsed;
    try{
      const clean=text.replace(/```json|```/g,'').trim();
      parsed=JSON.parse(clean);
    }catch{
      st.innerHTML='<div class="cd" style="background:#fef3c7;border-color:#f59e0b;padding:12px"><b>\u26a0\ufe0f No se pudo interpretar la respuesta</b><p class="mu mt">Intenta con una foto m\u00e1s n\u00edtida.</p><details class="mt"><summary class="mu" style="cursor:pointer">Ver respuesta</summary><p style="font-size:11px;margin-top:6px;word-break:break-all">'+h(text)+'</p></details></div>';
      return;
    }
    
    fillFromOCR(parsed);
    
    // Store both versions for toggling
    const obsOrig=parsed.observacion_original||'';
    const obsMej=parsed.observacion_mejorada||'';
    
    st.innerHTML='<div class="cd" style="background:#f0fdf4;border-color:#86efac;padding:12px">'
      +'<b style="color:#166534">\u2705 Folio le\u00eddo correctamente</b>'
      +'<p class="mu mt">Revisa los campos y ajusta si es necesario</p>'
      +(obsOrig?'<div class="fs"><h4>\ud83d\udcdd Original del folio</h4><p style="font-size:12px;color:#475569;font-style:italic">\u201c'+h(obsOrig)+'\u201d</p></div>':'')
      +(obsMej?'<div class="fs"><h4>\u2728 Redacci\u00f3n t\u00e9cnica (para informe)</h4><p style="font-size:12px;color:var(--tx)">'+h(obsMej)+'</p></div>':'')
      +'<div class="mt" style="display:flex;gap:6px">'
      +(obsOrig?'<button class="bt bt-x bt-s" onclick="document.getElementById(\'vx\').value=\''+h(obsOrig).replace(/'/g,"\\'")+'\'">Usar original</button>':'')
      +(obsMej?'<button class="bt bt-g bt-s" onclick="document.getElementById(\'vx\').value=\''+h(obsMej).replace(/'/g,"\\'")+'\'">Usar mejorada \u2728</button>':'')
      +'</div></div>';
    
  }catch(err){
    st.innerHTML='<div class="cd" style="background:#fee2e2;border-color:#fca5a5;padding:12px"><b style="color:var(--r)">\u274c Error</b><p class="mu mt">'+h(err.message)+'</p><p class="mu">Completa los datos manualmente.</p></div>';
  }
}

function fillFromOCR(parsed){
  // OCR solo interpreta la observación del folio.
  // NO modifica fecha, nombre, RUT, rubro ni sector — esos los indica el usuario.
  const obs=parsed.observacion_mejorada||parsed.observacion_original||'';
  if(obs){const el=document.getElementById('vx');if(el)el.value=obs}
  if(!ev)ev={};
  ev.obs_original=parsed.observacion_original||'';
  ev.obs_mejorada=parsed.observacion_mejorada||'';
}

function sV(){
  const a=document.getElementById('va')?.value;
  if(!a){alert('Ingresa el nombre del agricultor');return}
  const nv={
    id:ev?.id||Date.now().toString(),
    folio:document.getElementById('vf')?.value||'',

    rut:document.getElementById('vr')?.value||'',
    rubro:document.getElementById('vb')?.value||'',
    sector:document.getElementById('vs')?.value||'',
    tipo:document.getElementById('vt')?.value||'',
    objetivo:document.getElementById('vo')?.value||'',
    observacion:document.getElementById('vx')?.value||'',
    estado:document.getElementById('ve')?.value||'Firmado',
    asesor:ev?.id?stdAsesor(ev.asesor):stdAsesor(cfg.abr||cfg.nombre)
  };
  // Photo
  const ip=document.getElementById('imgP');
  if(ip?.dataset?.src)nv.foto=ip.dataset.src;
  else if(ev?.foto)nv.foto=ev.foto;

  if(ev?.id)vis=vis.map(x=>String(x.id)===String(nv.id)?nv:x);else vis.push(nv);
  SV('vis',vis);sfv=false;ev=null;R();nf('✅ Visita guardada');
  syncToCloud(nv); // Sync to Google Sheets
}

// ========= GOOGLE SHEETS SYNC =========
async function syncToCloud(visita){
  if(!SYNC_URL)return;
  try{
    await fetch(SYNC_URL+'?action=write',{method:'POST',body:JSON.stringify(visita),headers:{'Content-Type':'text/plain'}});
  }catch(e){console.log('Sync write error:',e)}
}

async function syncFromCloud(){
  if(syncing||!SYNC_URL)return;
  syncing=true;
  const btn=document.getElementById('syncBtn');
  if(btn){btn.innerHTML='🔄 Sincronizando...';btn.disabled=true}
  try{
    const r=await fetch(SYNC_URL+'?action=read');
    const d=await r.json();
    if(d.visitas&&d.visitas.length>0){
      // Merge: cloud wins for same id, keep local-only
      const cloudMap={};
      d.visitas.forEach(v=>{cloudMap[v.id]=v});
      const localOnly=vis.filter(v=>!cloudMap[v.id]);
      // Upload local-only to cloud
      for(const v of localOnly){
        try{await fetch(SYNC_URL+'?action=write',{method:'POST',body:JSON.stringify(v),headers:{'Content-Type':'text/plain'}})}catch{}
      }
      // Merge all — preservar foto local (la nube no almacena fotos)
      const localFotoMap={};
      vis.forEach(v=>{if(v.foto)localFotoMap[v.id]=v.foto});
      const merged=[...d.visitas,...localOnly];
      vis=merged.map(v=>({...v,asesor:stdAsesor(v.asesor),foto:v.foto||localFotoMap[v.id]||''}));
      SV('vis',vis);
      lastSync=new Date().toLocaleString('es-CL');
      SV('lastSync',lastSync);
      nf('☁️ Sincronizado: '+vis.length+' visitas');
    }else if(vis.length>0){
      // Cloud empty, upload all local
      try{
        await fetch(SYNC_URL+'?action=sync',{method:'POST',body:JSON.stringify({visitas:vis}),headers:{'Content-Type':'text/plain'}});
        lastSync=new Date().toLocaleString('es-CL');
        SV('lastSync',lastSync);
        nf('☁️ Subidas '+vis.length+' visitas a la nube');
      }catch{}
    }else{
      nf('☁️ Sin visitas que sincronizar');
    }
  }catch(e){
    nf('⚠️ Error de conexión: '+e.message);
  }
  syncing=false;
  if(btn){btn.innerHTML='☁️ Sincronizar';btn.disabled=false}
  R();
}

async function deleteFromCloud(id){
  if(!SYNC_URL)return;
  try{await fetch(SYNC_URL+'?action=delete&id='+id)}catch(e){console.log('Sync delete error:',e)}
}

// Rango lunes–viernes de una semana ISO
function weekRange(w,year=2026){const j4=new Date(year,0,4);const mon=new Date(j4);mon.setDate(j4.getDate()-((j4.getDay()+6)%7)+(w-1)*7);const fri=new Date(mon);fri.setDate(mon.getDate()+4);return {ini:mon,fin:fri}}
const fmtLargo=d=>{if(!d)return '';const x=typeof d==='string'?new Date(d+'T12:00:00'):d;const t=x.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const fmtCorto=d=>{if(!d)return '';const x=typeof d==='string'?new Date(d+'T12:00:00'):d;return x.toLocaleDateString('es-CL',{day:'numeric',month:'long'})};
// Texto del período: "22 al 26 de septiembre de 2026" / "Septiembre de 2026"
function periodoTexto(periodo){
  if(periodo==='sem'){const w=+document.getElementById('gs').value;const {ini,fin}=weekRange(w);
    const mi=ini.toLocaleDateString('es-CL',{month:'long'}),mf=fin.toLocaleDateString('es-CL',{month:'long'});
    return (mi===mf?ini.getDate()+' al '+fin.getDate()+' de '+mf:ini.getDate()+' de '+mi+' al '+fin.getDate()+' de '+mf)+' de '+fin.getFullYear()}
  const m=+document.getElementById('gm').value;return MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1)+' de 2026';
}

// Actividades del período: semanal = tal cual; mensual = compila todas las semanas del mes
// Devuelve acts[seccion] = [{fecha,lugar,texto,semana}], fotos[seccion] (2 o 4), resumen
function getActsCompiled(periodo){
  const base=getActs(getActKey(periodo));
  const out={};
  const semanas=[];
  if(periodo==='sem') semanas.push(+document.getElementById('gs').value);
  else{const m=+(document.getElementById('gm')?.value||new Date().getMonth());const st=new Set();
    for(let d=new Date(2026,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)) if(d.getDay()>=1&&d.getDay()<=5) st.add(wk(d));
    semanas.push(...[...st].sort((a,b)=>a-b))}
  semanas.forEach(w=>{const k='sem'+w+'_2026';
    ACT_SECCIONES.forEach(sec=>{
      const l=getActList(k,sec.key).filter(a=>(a.texto||'').trim()||(a.titulo||'').trim()||fotosPares(a.id).length);
      if(l.length) out[sec.key]=(out[sec.key]||[]).concat(l.map(a=>({...a,semana:w,fotos:fotosPares(a.id)})));
    })});
  return {acts:out,fotos:{},resumen:(base.resumen||'').trim()};
}

// Resumen por rubro: usuarios asignados/visitados, visitas y recomendaciones (para informes)
function resumenPorRubro(vt,asesorSel){
  const normR=r=>(r||'').toString().replace(/[\s.]/g,'').toUpperCase();
  const normT=s=>(s||'').replace(/\.\s*/g,'.').toUpperCase().trim();
  const byRut={};U.forEach(u=>byRut[normR(u.rut)]=u);
  const eqSel=EQUIPO.find(e=>e.abr===asesorSel);
  const asignados=(eqSel&&eqSel.cargo==='Asesor Técnico')?U.filter(u=>normT(u.tecnico)===normT(asesorSel)):U; // AP y coordinador atienden todo el programa
  const rub={};
  const key=r=>(r||'').toString().trim().toUpperCase()||'SIN RUBRO';
  asignados.forEach(u=>{const k=key(u.rubro);rub[k]=rub[k]||{rubro:k,asignados:0,visitados:new Set(),visitas:0,obs:[]};rub[k].asignados++});
  vt.forEach(v=>{const u=byRut[normR(v.rut)];const k=key(v.rubro||(u&&u.rubro));rub[k]=rub[k]||{rubro:k,asignados:0,visitados:new Set(),visitas:0,obs:[]};
    rub[k].visitas++;rub[k].visitados.add(normR(v.rut));const o=(v.observacion||'').trim();if(o)rub[k].obs.push({agricultor:v.agricultor||'',obs:o})});
  return Object.values(rub).filter(r=>r.visitas||r.asignados).sort((a,b)=>b.visitas-a.visitas||a.rubro.localeCompare(b.rubro))
    .map(r=>({...r,visitados:r.visitados.size}));
}

async function recomendacionesPorRubro(rubros,periodoTxt){
  const local=r=>{const frases=r.obs.map(o=>o.obs.split(/(?<=[.;])\s+/).find(f=>/recomend|suger|instru|indic|se debe|aplicar|realizar/i.test(f))||o.obs.split(/(?<=[.;])\s+/)[0]).map(f=>f.trim().replace(/\.$/,''));
    const uniq=[...new Set(frases)].slice(0,4).map(f=>f.charAt(0).toUpperCase()+f.slice(1));return uniq.length?uniq.join('. ')+'.':'Sin recomendaciones registradas.'};
  const out={};rubros.forEach(r=>out[r.rubro]=local(r));
  if(!cfg.apiKey)return out;
  const conObs=rubros.filter(r=>r.obs.length);if(!conObs.length)return out;
  try{
    const prompt='Eres asesor del programa PRODESAL Peumo (INDAP, Chile). A partir de las observaciones de visitas técnicas de '+periodoTxt+', redacta para CADA rubro un resumen de 2 a 4 frases, en tono técnico e impersonal, con las principales recomendaciones entregadas a los usuarios y los problemas recurrentes detectados. No inventes datos, no uses viñetas ni títulos, no menciones nombres de usuarios. Responde SOLO con JSON válido con la forma {"RUBRO": "texto", ...} usando exactamente estos rubros: '+conObs.map(r=>r.rubro).join(', ')+'.\n\n'
      +conObs.map(r=>'### '+r.rubro+' ('+r.visitas+' visitas)\n'+r.obs.slice(0,40).map(o=>'- '+o.obs.slice(0,500)).join('\n')).join('\n\n');
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:prompt}]})});
    const j=await resp.json();const txt=(j.content&&j.content[0]&&j.content[0].text||'').trim();
    const m=txt.match(/\{[\s\S]*\}/);if(m){const o=JSON.parse(m[0]);Object.keys(o).forEach(k=>{const kk=k.toUpperCase().trim();if(out[kk]!==undefined&&typeof o[k]==='string'&&o[k].trim())out[kk]=o[k].trim()})}
  }catch(e){console.warn('resumen rubro IA',e)}
  return out;
}

// ========= KIT COMÚN DE DOCUMENTOS .docx (estilos, encabezado, pie, firmas) =========
function docxKit(){
  const D=docx;
  const NAVY='1F3864',BLUE='2E75B6',GRAY='595959',LIGHT='F2F5F9',LINE='BFC7D1';
  const F='Calibri';
  const b64u=url=>{const b=atob((url||'').split(',')[1]||url);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
  const imgType=url=>/^data:image\/png/i.test(url||'')?'png':/^data:image\/gif/i.test(url||'')?'gif':'jpg';
  const img=(url,w,h)=>new D.ImageRun({data:b64u(url),transformation:{width:w,height:h},type:imgType(url)});

  const run=(text,o={})=>new D.TextRun({text:(text==null?'':String(text)),font:F,size:20,color:'262626',...o}); // 10pt
  const par=(runs,o={})=>new D.Paragraph({children:Array.isArray(runs)?runs:[runs],spacing:{before:0,after:120,line:276},...o});
  const none={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'};
  const noB={top:none,bottom:none,left:none,right:none};
  const cell=(children,o={})=>new D.TableCell({children:Array.isArray(children)?children:[children],borders:noB,verticalAlign:D.VerticalAlign.CENTER,margins:{top:60,bottom:60,left:100,right:100},...o});
  const W=9900; // ancho útil (dxa)

  const styles={default:{document:{run:{font:F,size:20}}}};
  const pageProps={page:{size:{width:12240,height:15840},margin:{top:1700,right:1170,bottom:1200,left:1170,header:400,footer:400}}};
  const firma=(n,c,d,w=3300)=>{const sm=w<3000;return cell([par(run(''),{spacing:{before:700,after:0},border:{bottom:{style:D.BorderStyle.SINGLE,size:6,color:NAVY,space:1}}}),
      par(run((n||'').toUpperCase(),{bold:true,size:sm?16:18,color:NAVY}),{alignment:D.AlignmentType.CENTER,spacing:{before:80,after:0}}),
      par(run(c||'',{size:sm?14:16,color:GRAY}),{alignment:D.AlignmentType.CENTER,spacing:{after:0}}),
      par(run(d||'\u00a0',{size:sm?14:16,color:GRAY}),{alignment:D.AlignmentType.CENTER,spacing:{after:0}})],
    {width:{size:w,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:sm?100:200,right:sm?100:200},verticalAlign:D.VerticalAlign.BOTTOM})};
  const frame=()=>{
  let logoIndap=null,logoPeumo=null,logoProd=null;
  try{logoIndap=img(LOGO_INDAP,62,62)}catch(e){}
  try{logoProd=img(LOGO_PRODESAL,62,62)}catch(e){}
  try{logoPeumo=img(LOGO_PEUMO,175,33)}catch(e){}
  const header=new D.Header({children:[
    new D.Table({width:{size:W,type:D.WidthType.DXA},layout:D.TableLayoutType.FIXED,rows:[new D.TableRow({children:[
      cell(par(logoIndap||run(''),{spacing:{after:0}}),{width:{size:W/3,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:0,right:0}}),
      cell(par(logoProd||run(''),{alignment:D.AlignmentType.CENTER,spacing:{after:0}}),{width:{size:W/3,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:0,right:0}}),
      cell(par(logoPeumo||run(''),{alignment:D.AlignmentType.RIGHT,spacing:{after:0}}),{width:{size:W/3,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:0,right:0}})]})]}),
    par(run(''),{spacing:{before:0,after:120},border:{bottom:{style:D.BorderStyle.SINGLE,size:8,color:NAVY,space:1}}})
  ]});
  const footer=new D.Footer({children:[new D.Table({width:{size:W,type:D.WidthType.DXA},layout:D.TableLayoutType.FIXED,rows:[new D.TableRow({children:[
    cell(par(run('PRODESAL Peumo  ·  INDAP  ·  Región del Libertador General Bernardo O’Higgins',{size:14,color:GRAY}),{spacing:{after:0}}),{width:{size:7000,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:0,right:0},borders:{...noB,top:{style:D.BorderStyle.SINGLE,size:4,color:LINE}}}),
    cell(new D.Paragraph({alignment:D.AlignmentType.RIGHT,spacing:{after:0},children:[run('Página ',{size:14,color:GRAY}),new D.TextRun({children:[D.PageNumber.CURRENT],font:F,size:14,color:GRAY}),run(' de ',{size:14,color:GRAY}),new D.TextRun({children:[D.PageNumber.TOTAL_PAGES],font:F,size:14,color:GRAY})]}),{width:{size:2900,type:D.WidthType.DXA},margins:{top:0,bottom:0,left:0,right:0},borders:{...noB,top:{style:D.BorderStyle.SINGLE,size:4,color:LINE}}})
  ]})]})]});

    return {header,footer};
  };
  const descargar=async(docObj,fn)=>{
    try{nf('⏳ Generando '+fn+'.docx...');const blob=await D.Packer.toBlob(docObj);
      const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=fn+'.docx';link.click();URL.revokeObjectURL(url);nf('📄 '+fn+'.docx generado')}
    catch(e){nf('⚠️ Error generando .docx: '+e.message);console.error('docx error:',e)}
  };
  return {D,NAVY,BLUE,GRAY,LIGHT,LINE,F,img,run,par,none,noB,cell,W,styles,pageProps,firma,frame,descargar};
}

  if(typeof docx==='undefined'){nf('⚠️ Cargando librería docx...');return}

  const K=docxKit();const {D,NAVY,BLUE,GRAY,LIGHT,LINE,F,img,run,par,none,noB,cell,W}=K;
  // Título de sección numerado con línea inferior
  let nSec=0;

  const texto=(t,o={})=>par(run(t),{alignment:D.AlignmentType.JUSTIFIED,...o});

  const nAct=Object.values(acts).reduce((n,l)=>n+l.length,0);

  body.push(new D.Table({width:{size:W,type:D.WidthType.DXA},layout:D.TableLayoutType.FIXED,

      cell(par(run(v,{size:20,color:NAVY}),{spacing:{after:0}}),{width:{size:W-2900,type:D.WidthType.DXA},borders:{...noB,bottom:{style:D.BorderStyle.SINGLE,size:4,color:LINE}}})
    ]}))}));

    vt.forEach((v,r)=>{

// Arma las actividades del período (compartido por planilla .xlsx y PDF)
async function buildActividades(periodo){
  const {vf,asesorNombre,asesorCargo,asesorSel}=getFilteredVis(periodo,'ind');
  const {acts,resumen}=getActsCompiled(periodo);
  const fmtD=f=>f?new Date(f+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'}):'';
  const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let mesNom,fn,periodoTxt;
  if(periodo==='sem'){const w=+document.getElementById('gs').value;mesNom='SEMANA '+w;fn='SEMANA_'+w+'_2026_INDAP';periodoTxt='la semana '+w}
  else{const m=+document.getElementById('gm').value;mesNom=MESES[m].toUpperCase();fn=mesNom+'_2026_INDAP';periodoTxt='el mes de '+MESES[m]}
  const vt=vf.filter(v=>v.tipo==='Visita Técnica'||!v.tipo).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const cap=t=>(t||'').charAt(0).toUpperCase()+(t||'').slice(1).toLowerCase();
  // cada actividad: {nombre, items:[{titulo,meta,texto}]}
  const actividades=[];
  const deActs=k=>(acts[k]||[]).map(a=>({titulo:(a.titulo||'').trim(),meta:[a.fecha?fmtLargo(a.fecha):'',(a.lugar||'').trim(),(periodo==='mes'&&a.semana)?'Semana '+a.semana:''].filter(Boolean).join('  ·  '),texto:(a.texto||'').trim()}));
  if(vt.length>0){
    const rubros=resumenPorRubro(vt,asesorSel);
    const recs=await recomendacionesPorRubro(rubros,periodoTxt);
    const usuarios=new Set(vt.map(v=>(v.rut||'').replace(/[\s.]/g,'').toUpperCase())).size;
    const items=[{titulo:'',meta:'',texto:'Durante '+periodoTxt+' se realizaron '+vt.length+' visitas técnicas en terreno a '+usuarios+' usuarios del programa, con el objetivo de atender sus necesidades de acuerdo con el Plan de Trabajo Anual (PTA), el rubro y el sistema productivo que desarrollan. Distribución por rubro:'}];
    rubros.forEach(r=>items.push({titulo:cap(r.rubro)+' — '+r.visitas+' visita'+(r.visitas===1?'':'s')+' a '+r.visitados+' usuario'+(r.visitados===1?'':'s'),meta:'',texto:recs[r.rubro]||''}));
    actividades.push({nombre:'VISITAS TÉCNICAS',items});
  }
  const reuItems=vf.filter(v=>norm(v.tipo).includes('reunion')).map(v=>({titulo:'',meta:fmtLargo(v.fecha),texto:v.observacion||'Reunión con '+(v.agricultor||'usuarios del programa')})).concat(deActs('reuniones'));
  if(reuItems.length) actividades.push({nombre:'REUNIONES Y CAPACITACIONES',items:reuItems});
  if(deActs('giras').length) actividades.push({nombre:'GIRAS TÉCNICAS / ASESORÍA DE ESPECIALISTAS',items:deActs('giras')});
  if(deActs('operativos').length) actividades.push({nombre:'OPERATIVOS VETERINARIOS / PARCELAS DEMOSTRATIVAS',items:deActs('operativos')});
  if(deActs('articulacion').length) actividades.push({nombre:'ARTICULACIÓN DE RECURSOS',items:deActs('articulacion')});
  const byTipo={};
  vf.filter(v=>v.tipo&&!v.tipo.includes('Visita')&&!norm(v.tipo).includes('reunion')).forEach(v=>{(byTipo[v.tipo]=byTipo[v.tipo]||[]).push(v)});
  Object.keys(byTipo).forEach(t=>actividades.push({nombre:t.toUpperCase(),items:byTipo[t].map(v=>({titulo:'',meta:fmtLargo(v.fecha),texto:v.observacion||v.agricultor||'Actividad realizada.'}))}));
  if(deActs('otras').length) actividades.push({nombre:'OTRAS ACTIVIDADES',items:deActs('otras')});
  if(actividades.length===0) actividades.push({nombre:'VISITAS TÉCNICAS',items:[{titulo:'',meta:'',texto:'Sin actividades registradas en el período.'}]});
  // texto plano por actividad (planilla PDF / compatibilidad)
  actividades.forEach(a=>{a.detalle=a.items.map(it=>[it.titulo,it.meta,it.texto].filter(Boolean).join(' — ')).join('\n')});
  return {actividades,vt,acts,mesNom,fn,asesorNombre,asesorCargo,periodoTxt,resumen:periodo==='mes'?resumen:''};
}

    }else html+='<p class="vac">Sin visitas técnicas registradas en el período.</p>';
    ACT_SECCIONES.forEach(s=>{
      const lista=acts[s.key]||[];
      html+=sec(s.label);
      if(!lista.length){html+='<p class="vac">Sin actividades registradas en el período.</p>';return}
      lista.forEach(a=>{const partes=[];if(a.fecha)partes.push(fmtLargo(a.fecha));if(a.lugar)partes.push(a.lugar.trim());if(!esSem&&a.semana)partes.push('Semana '+a.semana);
        html+='<div class="act">'+(a.titulo&&a.titulo.trim()?'<div class="tit">'+esc(a.titulo.trim().toUpperCase())+'</div>':'')+(partes.length?'<div class="meta">'+esc(partes.join('   ·   '))+'</div>':'')+parrafos(a.texto||'');
        const fs=a.fotos||[];if(fs.length) html+='<div class="grid">'+fs.map(f=>'<img src="'+f.data+'">').join('')+'</div><div class="cap">Registro fotográfico · '+esc(a.titulo&&a.titulo.trim()?a.titulo.trim():s.label)+'</div>';
        html+='</div>'});
    });
    html+='<table class="firmas"><tr>'+[[asesorNombre,asesorCargo,'Programa PRODESAL Peumo'],[cfg.coord||'',cfg.cCoord||'Coordinador Programa PRODESAL',''],[cfg.contra||'',cfg.cContra||'Contraparte Entidad Ejecutora',cfg.depto||'']]
      .map(([nm,c,d])=>'<td><div class="ln"></div><b>'+esc(nm.toUpperCase())+'</b><br><span>'+esc(c)+(d?'<br>'+esc(d):'')+'</span></td>').join('')+'</tr></table>';
  }
  w.document.open();
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(titulo)+'</title>'+css+'</head><body>'+bar+head+html+foot+'</body></html>');
  w.document.close();
  w.onload=()=>setTimeout(()=>w.print(),400);
  nf('🖨️ Vista de impresión abierta: elige «Guardar como PDF»');
}

// ========= COORDENADAS GPS =========
let coords=LD('coords')||{};
function getCoord(rut){return coords[rut]||null}
function saveCoord(rut,lat,lon){
  coords[rut]={lat:Math.round(lat*1000000)/1000000,lon:Math.round(lon*1000000)/1000000,fecha:td()};
  SV('coords',coords);
}
function getGPS(rut,n){
  if(!navigator.geolocation){nf('⚠️ GPS no disponible');return}
  nf('📍 Obteniendo ubicación...');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      saveCoord(rut,pos.coords.latitude,pos.coords.longitude);
      nf('✅ Coordenadas guardadas');
      R();
    },
    err=>{nf('⚠️ Error GPS: '+err.message)},
    {enableHighAccuracy:true,timeout:15000}
  );
}

// Init
if(cfg.nombre)document.getElementById('hs').textContent=cfg.nombre+' — '+cfg.cargo;
rT();R();
// Auto-sync on load
setTimeout(()=>{if(cfg.nombre&&SYNC_URL)syncFromCloud()},1500);
</script>
